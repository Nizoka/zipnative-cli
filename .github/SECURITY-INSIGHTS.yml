# zipnative-cli — OpenSSF Security Insights (specification 2.0.0).
# https://github.com/ossf/security-insights
# Every statement here must stay true of SECURITY.md,
# docs/.well-known/security.txt, package.json and .github/workflows/; update
# this file in the same change as any of them.
header:
  schema-version: 2.0.0
  last-updated: '2026-10-18'
  last-reviewed: '2026-10-18'
  url: https://raw.githubusercontent.com/Nizoka/zipnative-cli/main/.github/SECURITY-INSIGHTS.yml
  comment: >-
    Every statement here can be read in the repository: SECURITY.md,
    docs/.well-known/security.txt, package.json and the workflows under
    .github/workflows/.

project:
  name: zipnative-cli
  homepage: https://github.com/Nizoka/zipnative-cli
  administrators:
    - name: Nizoka
      primary: true
      social: https://github.com/Nizoka
  repositories:
    - name: zipnative-cli
      url: https://github.com/Nizoka/zipnative-cli
      comment: The command-line interface, its tests, its samples and its veraZIP conformance gate.
    - name: zipnative
      url: https://github.com/Nizoka/zipnative
      comment: The ZIP engine the CLI wraps, its single runtime dependency, where every byte of ZIP structure is parsed and bounded.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Nizoka
      primary: true
      social: https://github.com/Nizoka
    security-policy: https://github.com/Nizoka/zipnative-cli/blob/main/SECURITY.md
    comment: >-
      Report privately, never in a public issue, through GitHub private
      vulnerability reporting:
      https://github.com/Nizoka/zipnative-cli/security/advisories/new. A
      vulnerability in the zipnative engine itself is reported to
      https://github.com/Nizoka/zipnative/security/advisories/new. The
      handling timeline and the credit are in SECURITY.md.
  documentation:
    detailed-guide: https://github.com/Nizoka/zipnative-cli/blob/main/README.md
    code-of-conduct: https://github.com/Nizoka/zipnative-cli/blob/main/CODE_OF_CONDUCT.md
    release-process: https://github.com/Nizoka/zipnative-cli/blob/main/CONTRIBUTING.md#release
    signature-verification: https://github.com/Nizoka/zipnative-cli/blob/main/SECURITY.md

repository:
  url: https://github.com/Nizoka/zipnative-cli
  status: active
  accepts-change-request: true
  # Dependabot opens the automated ones (.github/dependabot.yml).
  accepts-automated-change-request: true
  core-team:
    - name: Nizoka
      primary: true
      social: https://github.com/Nizoka
  license:
    url: https://github.com/Nizoka/zipnative-cli/blob/main/LICENSE
    expression: MIT
  documentation:
    contributing-guide: https://github.com/Nizoka/zipnative-cli/blob/main/CONTRIBUTING.md
    security-policy: https://github.com/Nizoka/zipnative-cli/blob/main/SECURITY.md
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://www.npmjs.com/package/zipnative-cli
        comment: >-
          npm, published by .github/workflows/publish.yml on a published GitHub
          Release, through Trusted Publishing (OIDC) with provenance.
      - uri: https://github.com/Nizoka/zipnative-cli/releases
        comment: >-
          GitHub Releases, published by the maintainer; each one triggers the
          publish workflow, which attaches the registry's tarball, the SBOMs
          and their Sigstore attestation.
    changelog: https://github.com/Nizoka/zipnative-cli/blob/main/CHANGELOG.md
  security:
    assessments:
      self:
        comment: >-
          The release review run before every release, with coverage
          thresholds (vitest.config.ts), tests of the built binary, the
          blocking veraZIP ISO/IEC 21320-1 gate over a CLI-written corpus with
          negative canaries, adversarial archives generated in-test, and
          seeded fuzz tests of the CLI-owned parsers (tests/fuzz/, run with
          the rest of the suite). There is no coverage-guided fuzzing and no
          third-party audit.
        evidence: https://github.com/Nizoka/zipnative-cli/blob/main/SECURITY.md
    tools:
      - name: CodeQL
        type: SAST
        rulesets: [security-extended]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: TypeScript and the GitHub Actions workflows, on every push and pull request to main and weekly (codeql.yml); its results are required by the main ruleset.
      - name: zizmor
        type: SAST
        rulesets: [default]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: Security analysis of the workflows on every change (ci.yml, workflow lint).
      - name: actionlint
        type: other
        rulesets: [default]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: Workflow syntax and expression checks on every change (ci.yml, workflow lint).
      - name: REUSE
        type: other
        rulesets: [default]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: Licence and copyright of every file (REUSE.toml) on every change (ci.yml, workflow lint).
      - name: veraZIP
        type: other
        rulesets: [ISO/IEC 21320-1:2015]
        integration: { adhoc: false, ci: true, release: true }
        results: {}
        comment: Every archive the CLI writes, validated clause by clause by a vendored, engine-independent validator, with foreign integrity tools where the runner has them, on every change (verazip.yml) and in the publish gate (publish.yml).
      - name: OSV-Scanner
        type: SCA
        rulesets: [default]
        integration: { adhoc: true, ci: true, release: false }
        results: {}
        comment: The lockfile against the OSV database, weekly and on demand (audit.yml).
      - name: Dependabot
        type: SCA
        rulesets: [default]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: Weekly update pull requests for npm and GitHub Actions, after a seven-day cooldown; the engine bumps alone (.github/dependabot.yml).
      - name: Dependency Review
        type: SCA
        rulesets: [default]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: The dependency changes of every pull request, a required check (dependency-review.yml).
      - name: Scorecard
        type: other
        rulesets: [default]
        integration: { adhoc: false, ci: true, release: false }
        results: {}
        comment: OpenSSF Scorecard on every push to main and weekly (scorecard.yml).
