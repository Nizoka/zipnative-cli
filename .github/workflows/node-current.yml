name: Node Current

# The CI gate on the newest Node.js line (26) — information, not a contract:
# engines.node is >=22 and the required checks run 22 and 24. Advisory: not a
# required check in .github/rulesets/main.json.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: node-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-current:
    name: node 26 (current, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js 26
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the quality gate (CI profile)
        run: node scripts/gate.mjs --ci --require-all

      - name: Upload the gate logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-logs-linux-node26
          path: test-output/.gate/
          retention-days: 7
          if-no-files-found: ignore
