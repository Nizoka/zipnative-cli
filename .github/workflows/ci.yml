name: CI

on:
  push:
    branches: [main, master]
    # Docs are NOT ignored: tests/docs/consistency.test.ts pins README,
    # AGENTS.md, llms.txt and the knowledge base to the code, so a docs-only
    # change can break the suite and must run it.
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    # `edited` is added to the default types so a PR title change re-runs the
    # commitlint job (a "Re-run" of an existing run replays the old event
    # payload, i.e. the old title). The whole matrix runs on that event on
    # purpose: skipping jobs would report "skipped", which GitHub counts as a
    # passing required check.
    types: [opened, synchronize, reopened, edited]
    # Docs are NOT ignored: tests/docs/consistency.test.ts pins README,
    # AGENTS.md, llms.txt and the knowledge base to the code, so a docs-only
    # change can break the suite and must run it.
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Type check
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The product sells byte-reproducible archives; its own bundle must be
      # byte-reproducible too (tsup/esbuild with a locked toolchain).
      - name: Build is reproducible
        shell: bash
        run: |
          sha256sum dist/cli.cjs > build.sha
          npm run build
          sha256sum -c build.sha

      - name: Verify dist output
        # The package ships the CJS bin only (no ESM build, no .d.ts, no maps).
        run: |
          test -f dist/cli.cjs
          test ! -e dist/cli.js
          test ! -e dist/cli.d.ts
          test ! -e dist/cli.cjs.map

      # The built binary must answer --help / --version and expose the full
      # command surface through `schema manifest` (15 commands in 4 groups —
      # the single source of truth is src/commands/completion.ts COMMANDS).
      - name: Binary smoke test
        run: |
          node dist/cli.cjs --help
          node dist/cli.cjs --version
          node dist/cli.cjs schema manifest | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);if(!Array.isArray(m.commands)||m.commands.length!==15){console.error("schema manifest: expected 15 commands, got "+(Array.isArray(m.commands)?m.commands.length:"none"));process.exit(1)}console.log("schema manifest ok: "+m.commands.length+" commands")})'

      # Spawns the built dist/cli.cjs as a child process (real argv, real
      # stdin/stdout pipes, real exit codes) — this suite self-skips when
      # dist/ is absent, so it must run post-build.
      - name: Built-binary integration (post-build)
        run: npx vitest run tests/integration/built-binary-smoke.test.ts tests/integration/startup-budget.test.ts

  # A ZIP CLI lives or dies on Windows correctness: `\` vs `/` path
  # separators in entry names and --base/--prefix handling, reserved device
  # names (CON, NUL, COM1…) that the extraction sink must refuse, the
  # case-insensitive filesystem where two entries can collide on disk, and
  # CRLF checkouts that silently corrupt fixture bytes and the deterministic
  # SHA-256 proofs. This job is BLOCKING from 1.0.0 — any `skip on win32`
  # needs a linked issue. `shell: bash` keeps the POSIX `test -f` steps
  # portable (Git Bash ships on windows-latest).
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The product sells byte-reproducible archives; its own bundle must be
      # byte-reproducible too (tsup/esbuild with a locked toolchain).
      - name: Build is reproducible
        shell: bash
        run: |
          sha256sum dist/cli.cjs > build.sha
          npm run build
          sha256sum -c build.sha

      - name: Verify dist output
        shell: bash
        run: |
          test -f dist/cli.cjs
          test ! -e dist/cli.js
          test ! -e dist/cli.d.ts

      - name: Binary smoke test
        shell: bash
        run: |
          node dist/cli.cjs --help
          node dist/cli.cjs --version
          node dist/cli.cjs schema manifest | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);if(!Array.isArray(m.commands)||m.commands.length!==15){console.error("schema manifest: expected 15 commands, got "+(Array.isArray(m.commands)?m.commands.length:"none"));process.exit(1)}console.log("schema manifest ok: "+m.commands.length+" commands")})'

      - name: Built-binary integration (post-build)
        run: npx vitest run tests/integration/built-binary-smoke.test.ts tests/integration/startup-budget.test.ts

  # macOS is the second case-insensitive filesystem the sink handles
  # (utils/sink.ts CASE_INSENSITIVE_FS covers win32 AND darwin): the
  # case-fold collision and --flat duplicate policies must be exercised on
  # a real APFS volume, not only inferred from the Windows leg. Tests + a
  # build + the spawn smoke test; the veraZIP corpus stays Linux/Windows.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The product sells byte-reproducible archives; its own bundle must be
      # byte-reproducible too (tsup/esbuild with a locked toolchain).
      - name: Build is reproducible
        shell: bash
        run: |
          sha256sum dist/cli.cjs > build.sha
          npm run build
          sha256sum -c build.sha

      - name: Built-binary integration (post-build)
        run: npx vitest run tests/integration/built-binary-smoke.test.ts tests/integration/startup-budget.test.ts

  # Conventional Commits, enforced without a dependency: every commit subject
  # of the PR and the PR title (the squash-merge subject) must match the
  # pattern CONTRIBUTING.md documents. Not a required check until it has
  # run quietly for a while.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit subjects and the PR title
        # The PR title is checked because a squash merge turns it into the commit subject.
        # The range ends at the PR head, not at the synthetic "Merge X into Y" commit GitHub
        # builds for refs/pull/N/merge. Format is blocking; length over 100 is advisory
        # (Conventional Commits sets no limit — 100 is commitlint's default header length).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|chore|test|refactor|ci|build|perf|style|revert)(\([a-z0-9,./ -]+\))?!?: .+'
          fail=0
          check() {
            local subject="$1"
            if [ "${#subject}" -gt 100 ]; then echo "::warning::subject longer than 100 characters: $subject"; fi
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then echo "::error::not Conventional Commits: $subject"; fail=1; fi
          }
          while IFS= read -r subject; do check "$subject"; done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          check "$PR_TITLE"
          exit "$fail"
