name: CI

# The `ci` jobs run `scripts/gate.mjs --ci`, the single definition of "green":
# the step list lives in that file's STEPS table and is not repeated here, so
# CI, publish.yml and the contributor loop cannot drift apart. `--require-all`
# turns a SKIP into a FAIL (the zipnative checkout of the engine-data step is
# the one convenience skip; the Linux 22 leg provides it).
#
# `npm audit` runs outside the gate on purpose: the gate's verdict should be
# the same on a laptop and on a runner, and the advisory database is not.
#
# No path filter. Every job here reports a check the ruleset requires
# (.github/rulesets/main.json), and GitHub leaves the checks of a
# path-filtered workflow pending forever, which blocks the pull request.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    # `edited` re-runs the commitlint job when the PR title changes (a "Re-run"
    # replays the old event payload, i.e. the old title). The whole matrix
    # runs on that event on purpose: a skipped job reports "skipped", which
    # GitHub counts as a passing required check.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, five runs. `name:` is the status-check context the ruleset
  # requires; renaming one leaves every pull request waiting for a context
  # that never reports again.
  #
  # Windows and macOS are blocking: `\` vs `/` in entry names, reserved device
  # names (CON, NUL, COM1…) the sink must refuse, the case-insensitive
  # filesystems where two entries collide on disk (win32 AND darwin), Windows
  # symbolic-link semantics for the exclusive writes, CRLF checkouts that
  # would corrupt fixture bytes and the deterministic SHA-256 proofs, and the
  # npm.cmd shim are facts a Linux runner never exercises.
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'ci (22)', os: ubuntu-latest, node-version: 22, slug: linux-node22, audit: true, engine: true }
          - { name: 'ci (24)', os: ubuntu-latest, node-version: 24, slug: linux-node24, audit: false, engine: false }
          - { name: 'windows (22)', os: windows-latest, node-version: 22, slug: windows-node22, audit: false, engine: false }
          - { name: 'windows (24)', os: windows-latest, node-version: 24, slug: windows-node24, audit: false, engine: false }
          - { name: 'macos (22)', os: macos-latest, node-version: 22, slug: macos-node22, audit: false, engine: false }

    steps:
      # One step serves every leg, so the policy is the one Windows and macOS
      # allow (audit: the vendor's platform matrix at the pinned SHA).
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # 2026-10-18: audit only on Windows/macOS (vendor matrix), and one step serves every leg

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No lifecycle script of any dependency runs on the runner; the
      # repository's own .npmrc says the same for every developer machine.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Once per commit, not once per platform: the advisory database does
      # not depend on the runner.
      - name: Audit dependencies
        if: matrix.audit
        run: npm audit --audit-level=moderate

      # The engine-data step compares docs/data/{errors,core-exports}.json
      # with the engine's own registries at the tag node_modules holds
      # (scripts/sync-engine-data.mjs --check). Read-only clone.
      - name: Check out the pinned zipnative tag (engine-data step)
        if: matrix.engine
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=$(node -p "require('zipnative/package.json').version")
          git clone --quiet --depth 1 --branch "v${ENGINE}" https://github.com/Nizoka/zipnative.git "${RUNNER_TEMP}/zipnative"
          echo "ZIPNATIVE_ENGINE_CHECKOUT=${RUNNER_TEMP}/zipnative" >> "$GITHUB_ENV"

      - name: Run the quality gate (CI profile)
        run: node scripts/gate.mjs --ci --require-all

      - name: Upload the gate logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-logs-${{ matrix.slug }}
          path: test-output/.gate/
          retention-days: 7
          if-no-files-found: ignore

  # The workflows themselves are code that holds tokens. zizmor reads them for
  # the GitHub Actions weaknesses (template injection, excessive permissions,
  # unpinned or impostor actions, cache poisoning); actionlint checks syntax,
  # expressions and every `run:` script through shellcheck; `reuse lint`
  # checks that every file carries its licence (REUSE.toml). Pinned: zizmor
  # by the action and its version, actionlint by the SHA-256 of its release
  # archive, reuse by its version.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # 2026-10-18: the container registry hosts behind ghcr.io and PyPI are not baselined yet

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          min-severity: medium
          advanced-security: false
          annotations: true

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}" actionlint
          shellcheck --version | head -2
          "${RUNNER_TEMP}/actionlint" -color

      - name: REUSE compliance
        env:
          REUSE_VERSION: 6.2.0
        run: pipx run --spec "reuse==${REUSE_VERSION}" reuse lint

  # Conventional Commits, enforced without a dependency: every commit subject
  # of the PR and the PR title (the squash-merge subject) must match the
  # pattern CONTRIBUTING.md documents.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit subjects and the PR title
        # The PR title is checked because a squash merge turns it into the commit subject.
        # The range ends at the PR head, not at the synthetic "Merge X into Y" commit GitHub
        # builds for refs/pull/N/merge. Format is blocking; length over 100 is advisory
        # (Conventional Commits sets no limit — 100 is commitlint's default header length).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|chore|test|refactor|ci|build|perf|style|revert)(\([a-z0-9,./ -]+\))?!?: .+'
          fail=0
          check() {
            local subject="$1"
            if [ "${#subject}" -gt 100 ]; then echo "::warning::subject longer than 100 characters: $subject"; fi
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then echo "::error::not Conventional Commits: $subject"; fail=1; fi
          }
          while IFS= read -r subject; do check "$subject"; done < <(git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA")
          check "$PR_TITLE"
          exit "$fail"
