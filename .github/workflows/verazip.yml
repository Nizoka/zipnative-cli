name: ISO 21320-1 Validation (veraZIP)

# veraZIP — zipnative-cli's analogue of pdfnative-cli's veraPDF gate.
#
# WHAT: the BUILT binary (dist/cli.cjs) writes a corpus of 41 archives (37 conformant + 4 negative canaries)
# (scripts/generate-zip-corpus.mjs → test-output/zip/ + manifest.json)
# covering a representative sample of the features the CLI exposes:
# store/deflate, --stream, --parallel, --deterministic, zip64, directory
# entries, comments, modify append-only / --compact … plus raw-crafted
# NEGATIVE CANARIES (hostile archives built byte by byte, never by the
# CLI) that the validator MUST reject. scripts/validate-zip.mjs — a
# vendored copy of zipnative's ISO/IEC 21320-1:2015 validator with its
# own independent raw parser (it never imports the engine, so the engine
# is not attesting itself) — then checks every archive clause by clause
# and compares the verdict with the manifest's expectation:
#   level 0  ISO/IEC 21320-1 clause checks + APPNOTE cross-checks
#            (CD↔LFH agreement, offsets, overlap). ALWAYS runs.
#   level 1  foreign integrity pass (unzip -t, 7z t, python -m zipfile
#            -t, bsdtar -tf, jar tf) over the conformant corpus. Absent
#            tools are SKIPped, never simulated.
# An unexpected pass of a canary (XPASS) is fatal, so a validator that
# accepts everything fails the run instead of turning it green.
#
# WHY BLOCKING ON LINUX *AND* WINDOWS: the ZIP the CLI writes must be the
# same bytes on both platforms (deterministic builds are a semver-major
# contract), the corpus generator exercises the Windows-specific sink
# paths (reserved device names, `\` separators, case-folded collisions),
# and the level-1 tool set differs per runner image — a Windows-only
# rejection by bsdtar (tar.exe) or a Linux-only one by unzip would
# otherwise go unnoticed. Status: BLOCKING in zipnative-cli as of 1.0.0
# (precedent: zipnative's conformance gate, pdfnative-cli's veraPDF gate
# blocking since 1.4.0). The validate step has no `continue-on-error`.
#
# Exit codes of scripts/validate-zip.mjs:
#   0 all expectations met · 1 conformance FAIL / XPASS / level-1
#   rejection / canary drift · 2 no corpus · 3 INFRA (VERAZIP_REQUIRED=1
#   and no level-1 tool usable, or a file produced an INFRA outcome —
#   not a verdict).
#
# No `paths:` filter: a path-filtered workflow that does not run reports
# "Expected — Waiting for status" on a PR and blocks merging when the check is
# required in branch protection, so this gate runs on every push and PR.
#
# Level-1 tools come from the runner images, never from npm — the package
# keeps its zero-runtime-dependency policy (`zipnative` is the only runtime
# dependency) and nothing is downloaded:
#   ubuntu-latest   unzip, 7z (p7zip), python3, jar (Temurin), GNU tar —
#                   NOT bsdtar, so the bsdtar leg reports SKIP on Linux.
#   windows-latest  7z (7-Zip), tar.exe (bsdtar), python, jar (Temurin) —
#                   no unzip, so the unzip leg reports SKIP on Windows.
# Tool versions are echoed into the job summary first, so a failure is
# attributable to "our bug" vs "runner image tool drift".

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Manual runs against any branch from the Actions UI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verazip-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail-closed: zero usable level-1 integrity tools is an INFRA failure
  # (exit 3), never a silent skip that would leave the step green.
  VERAZIP_REQUIRED: '1'
  VERAZIP_REPORT_DIR: test-output/zip/reports

jobs:
  verazip-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # 2026-10-18: audit on Windows (vendor matrix); the registry is the only host either leg needs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Record tool versions
        run: |
          {
            echo '## veraZIP level-1 tool versions (ubuntu-latest)'
            echo '```'
            unzip -v | head -1 || true
            7z i | head -3 || true
            python3 --version || true
            tar --version | head -1 || true
            java -version 2>&1 | head -1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Generate ZIP corpus
        # Drives the BUILT dist/cli.cjs; dist/ comes from the Build step above.
        run: npm run corpus:zip

      # BLOCKING (see header). The exit code drives the step outcome — the
      # step fails naturally on a non-zero exit — and the summary step below
      # surfaces the verdict:
      #   0 all expectations met · 1 conformance FAIL / XPASS / level-1
      #   rejection / canary · 2 no corpus · 3 INFRA (not a verdict).
      # Plain redirects only (no process substitution) so the identical
      # script runs under Git Bash on the Windows job.
      - name: Validate ZIP corpus (blocking)
        id: validate
        shell: bash
        run: |
          set +e
          node scripts/validate-zip.mjs > verazip-report.txt 2> verazip-stderr.txt
          code=$?
          cat verazip-report.txt
          [ -s verazip-stderr.txt ] && cat verazip-stderr.txt >&2
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "${code}"

      # Per-file JSON reports + summary.json live under
      # test-output/zip/reports/ — upload them so a FAIL / INFRA line can be
      # diagnosed without re-running the job.
      - name: Upload veraZIP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verazip-report-${{ runner.os }}
          path: |
            verazip-report.txt
            verazip-stderr.txt
            test-output/zip/manifest.json
            test-output/zip/reports/
          if-no-files-found: warn
          retention-days: 14

      # Step outputs reach the script through env:, never interpolated into it
      # (template injection — zizmor / actionlint). RUNNER_OS is set by the runner.
      - name: Job summary
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
          OUTCOME: ${{ steps.validate.outcome }}
        run: |
          code="${EXIT_CODE}"
          case "${code}" in
            0) verdict='all expectations met' ;;
            1) verdict='CONFORMANCE failure (FAIL, XPASS, level-1 rejection or canary drift — see report)' ;;
            2) verdict='no corpus generated' ;;
            3) verdict='INFRA failure — no usable level-1 tool or an INFRA outcome (NOT a conformance verdict)' ;;
            *) verdict="unknown (exit ${code:-n/a})" ;;
          esac
          {
            echo "## ISO/IEC 21320-1 validation (veraZIP, blocking, ${RUNNER_OS})"
            echo
            echo "Step outcome: ${OUTCOME} · exit ${code:-n/a} · ${verdict}"
            echo
            echo '```'
            cat verazip-report.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
            if [ -s verazip-stderr.txt ]; then
              echo
              echo '<details><summary>validator stderr</summary>'
              echo
              echo '```'
              cat verazip-stderr.txt
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verazip-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # 2026-10-18: audit on Windows (vendor matrix); the registry is the only host either leg needs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Record tool versions
        shell: pwsh
        run: |
          "## veraZIP level-1 tool versions (windows-latest)" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          & "C:\Program Files\7-Zip\7z.exe" i | Select-Object -First 3 >> $env:GITHUB_STEP_SUMMARY
          tar.exe --version | Select-Object -First 1 >> $env:GITHUB_STEP_SUMMARY
          python --version >> $env:GITHUB_STEP_SUMMARY
          java -version 2>&1 | Select-Object -First 1 >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Build
        run: npm run build

      - name: Generate ZIP corpus
        run: npm run corpus:zip

      # Same script as the Linux leg — Git Bash on windows-latest.
      - name: Validate ZIP corpus (blocking)
        id: validate
        shell: bash
        run: |
          set +e
          node scripts/validate-zip.mjs > verazip-report.txt 2> verazip-stderr.txt
          code=$?
          cat verazip-report.txt
          [ -s verazip-stderr.txt ] && cat verazip-stderr.txt >&2
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "${code}"

      - name: Upload veraZIP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verazip-report-${{ runner.os }}
          path: |
            verazip-report.txt
            verazip-stderr.txt
            test-output/zip/manifest.json
            test-output/zip/reports/
          if-no-files-found: warn
          retention-days: 14

      # Step outputs reach the script through env:, never interpolated into it
      # (template injection — zizmor / actionlint). RUNNER_OS is set by the runner.
      - name: Job summary
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
          OUTCOME: ${{ steps.validate.outcome }}
        run: |
          code="${EXIT_CODE}"
          case "${code}" in
            0) verdict='all expectations met' ;;
            1) verdict='CONFORMANCE failure (FAIL, XPASS, level-1 rejection or canary drift — see report)' ;;
            2) verdict='no corpus generated' ;;
            3) verdict='INFRA failure — no usable level-1 tool or an INFRA outcome (NOT a conformance verdict)' ;;
            *) verdict="unknown (exit ${code:-n/a})" ;;
          esac
          {
            echo "## ISO/IEC 21320-1 validation (veraZIP, blocking, ${RUNNER_OS})"
            echo
            echo "Step outcome: ${OUTCOME} · exit ${code:-n/a} · ${verdict}"
            echo
            echo '```'
            cat verazip-report.txt 2>/dev/null || echo "(no report produced)"
            echo '```'
            if [ -s verazip-stderr.txt ]; then
              echo
              echo '<details><summary>validator stderr</summary>'
              echo
              echo '```'
              cat verazip-stderr.txt
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
