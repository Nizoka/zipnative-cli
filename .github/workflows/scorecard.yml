name: Scorecard supply-chain security

# OpenSSF Scorecard: weekly and on every push to main, results published to
# the OpenSSF dataset and uploaded to code scanning. Least privilege at the
# top level; the job holds exactly what the action documents.

on:
  schedule:
    - cron: '27 3 * * 1'
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # Upload the SARIF results to the Security tab.
      id-token: write # Publish signed results to the OpenSSF public dataset.
      contents: read # Read repository metadata (branch protection, etc.).
      actions: read # Read the workflow runs and their files, which several checks score.

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # 2026-10-18: the Scorecard API and the GitHub APIs it walks are not baselined yet

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # The same codeql-action release as codeql.yml (one SHA across the tree).
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
